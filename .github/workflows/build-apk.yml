name: Build APK

# Builds a STANDALONE APK.
#
# Why release and not debug: a debug build does not carry its JavaScript, it expects the Metro
# dev server on localhost:8081. Installed on a phone with no Metro running, it dies with
# "Unable to load script. Make sure you're either running Metro... or that your bundle
# 'index.android.bundle' is packaged correctly" — which is exactly the failure this workflow
# now prevents. A release build bundles the JS into assets/ and runs on its own.
#
# The release variant is signed with the debug keystore unless LUDO_KEYSTORE_PATH is set, so CI
# can build without secrets; that is fine for testing and must not be used for a store upload.
#
# Two other things worth knowing about this file:
#   * the repo's checked-in gradle-wrapper.jar cannot load its main class on the runner, so the
#     build uses a real Gradle distribution from gradle/actions/setup-gradle;
#   * the Android SDK is already on the image, so sdkmanager is called directly.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit
          npx jest --silent

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Verify the APK carries its own JavaScript
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "APK: $APK"
          if ! unzip -l "$APK" | grep -q 'assets/index.android.bundle'; then
            echo "::error::assets/index.android.bundle is missing — this APK would need Metro and would fail on a phone."
            exit 1
          fi
          echo "Bundled JS present: OK"
          ls -lh "$APK"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ludo-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
